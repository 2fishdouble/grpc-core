spring:
  application:
    name: grpc
  grpc:
    # ==========================================
    # Server 角色：本进程作为 gRPC Server，对外暴露服务
    #   - GreeterService    (greeter.proto)
    #   - CalculatorService (calculator.proto)
    # ==========================================
    server:
      port: 9090

    # ==========================================
    # Client 角色：同一个进程也作为 gRPC Client 调用服务
    #
    # calculator: 调用 CalculatorService
    #   演示时指向本进程自己 (localhost:9090)，形成 Server+Client 单进程闭环；
    #   如需调用真实远端服务，改为:
    #     target: static://real-calc-server:9090
    # ==========================================
    client:
      channel:
        calculator:
          target: static://localhost:9090

server:
  port: 8080

logging:
  level:
    fc.grpc: DEBUG
